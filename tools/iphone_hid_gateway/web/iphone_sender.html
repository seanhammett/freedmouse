<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USB_freeD iPhone Sender</title>
  <style>
    :root {
      --bg: #101820;
      --card: #16232f;
      --text: #e8f0f7;
      --muted: #95a8bb;
      --accent: #f2aa4c;
      --ok: #40c463;
      --warn: #ffae42;
      --err: #ff6961;
    }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1b2e3f 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      box-sizing: border-box;
    }

    .card {
      width: min(560px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.2rem;
      letter-spacing: 0.01em;
    }

    .sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.22);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .btns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1c1c1c;
      background: var(--accent);
    }

    button.alt {
      background: #d9e2ec;
    }

    button.warn {
      background: var(--warn);
    }

    button:disabled {
      opacity: 0.55;
    }

    .status {
      margin: 12px 0 10px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .status.warn { color: var(--warn); }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 12px;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .label { color: var(--muted); }

    .mono {
      font-family: Consolas, "SF Mono", monospace;
      font-size: 0.84rem;
      word-break: break-word;
      background: rgba(0, 0, 0, 0.24);
      border-radius: 8px;
      padding: 8px;
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>USB_freeD iPhone IMU Sender</h1>
    <p class="sub">Streams quaternion packets to the PC gateway. Keep this tab in foreground while streaming.</p>

    <div class="row">
      <input id="ws-url" type="text" value="" />
      <button id="btn-connect" class="alt">Connect</button>
    </div>

    <div class="btns">
      <button id="btn-motion" class="alt">Enable Motion</button>
      <button id="btn-stream" disabled>Start Stream</button>
      <button id="btn-home" class="warn" disabled>Home Reset</button>
      <button id="btn-stop" class="alt" disabled>Stop Stream</button>
    </div>

    <div id="status" class="status warn">Disconnected</div>

    <div class="grid">
      <div class="label">Send Rate</div><div id="rate">0 Hz</div>
      <div class="label">Seq</div><div id="seq">0</div>
      <div class="label">Server Hz</div><div id="server-hz">-</div>
      <div class="label">Dropped</div><div id="dropped">-</div>
      <div class="label">Out-of-order</div><div id="ooo">-</div>
      <div class="label">Last Cmd</div><div id="cmd">-</div>
    </div>

    <div id="quat" class="mono">quat: -</div>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const rateEl = document.getElementById('rate');
    const seqEl = document.getElementById('seq');
    const serverHzEl = document.getElementById('server-hz');
    const droppedEl = document.getElementById('dropped');
    const oooEl = document.getElementById('ooo');
    const cmdEl = document.getElementById('cmd');
    const quatEl = document.getElementById('quat');

    const wsUrlEl = document.getElementById('ws-url');
    const connectBtn = document.getElementById('btn-connect');
    const motionBtn = document.getElementById('btn-motion');
    const streamBtn = document.getElementById('btn-stream');
    const stopBtn = document.getElementById('btn-stop');
    const homeBtn = document.getElementById('btn-home');

    let ws = null;
    let motionReady = false;
    let streaming = false;
    let seq = 0;
    let latestQuat = null;
    const sentTimes = [];

    const wsScheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const defaultWs = `${wsScheme}://${location.host}/ws`;
    wsUrlEl.value = defaultWs;

    function setStatus(msg, cls) {
      statusEl.textContent = msg;
      statusEl.className = `status ${cls}`;
    }

    function updateButtons() {
      const connected = ws && ws.readyState === WebSocket.OPEN;
      streamBtn.disabled = !connected || !motionReady || streaming;
      stopBtn.disabled = !streaming;
      homeBtn.disabled = !connected;
      motionBtn.disabled = motionReady;
    }

    function toQuat(alphaDeg, betaDeg, gammaDeg) {
      const d2r = Math.PI / 180;
      const x = (betaDeg || 0) * d2r * 0.5;
      const y = (gammaDeg || 0) * d2r * 0.5;
      const z = (alphaDeg || 0) * d2r * 0.5;

      const cX = Math.cos(x), cY = Math.cos(y), cZ = Math.cos(z);
      const sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z);

      const w = cX * cY * cZ - sX * sY * sZ;
      const qx = sX * cY * cZ - cX * sY * sZ;
      const qy = cX * sY * cZ + sX * cY * sZ;
      const qz = cX * cY * sZ + sX * sY * cZ;

      const n = Math.sqrt(w * w + qx * qx + qy * qy + qz * qz) || 1;
      return { w: w / n, x: qx / n, y: qy / n, z: qz / n };
    }

    function trimRateWindow(now) {
      while (sentTimes.length > 0 && sentTimes[0] < now - 1000) {
        sentTimes.shift();
      }
      rateEl.textContent = `${sentTimes.length} Hz`;
    }

    function sendImu() {
      if (!streaming || !latestQuat || !ws || ws.readyState !== WebSocket.OPEN) return;

      seq = (seq + 1) & 0xFF;
      const payload = {
        type: 'imu',
        seq,
        quat: latestQuat,
        flags: 0,
      };

      ws.send(JSON.stringify(payload));
      seqEl.textContent = String(seq);

      const now = performance.now();
      sentTimes.push(now);
      trimRateWindow(now);

      quatEl.textContent = `quat: w=${latestQuat.w.toFixed(4)} x=${latestQuat.x.toFixed(4)} y=${latestQuat.y.toFixed(4)} z=${latestQuat.z.toFixed(4)}`;
    }

    async function enableMotion() {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const result = await DeviceOrientationEvent.requestPermission();
          if (result !== 'granted') {
            setStatus('Motion permission denied', 'err');
            return;
          }
        }

        window.addEventListener('deviceorientation', (evt) => {
          latestQuat = toQuat(evt.alpha, evt.beta, evt.gamma);
          sendImu();
        }, true);

        motionReady = true;
        setStatus('Motion enabled', 'ok');
      } catch (err) {
        setStatus(`Motion error: ${err.message}`, 'err');
      }

      updateButtons();
    }

    function connect() {
      try {
        ws = new WebSocket(wsUrlEl.value.trim());
      } catch (err) {
        setStatus(`Socket error: ${err.message}`, 'err');
        return;
      }

      ws.addEventListener('open', () => {
        setStatus('Connected', 'ok');
        ws.send(JSON.stringify({ type: 'hello', role: 'phone' }));
        updateButtons();
      });

      ws.addEventListener('message', (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'telemetry') {
            serverHzEl.textContent = msg.hz ?? '-';
            droppedEl.textContent = msg.droppedPackets ?? '-';
            oooEl.textContent = msg.outOfOrderPackets ?? '-';
            if (msg.lastCmd) {
              cmdEl.textContent = `${msg.lastCmd.rx}, ${msg.lastCmd.ry}, ${msg.lastCmd.rz}`;
            }
          }
        } catch (_) {
          // Ignore malformed telemetry.
        }
      });

      ws.addEventListener('close', () => {
        streaming = false;
        setStatus('Disconnected', 'warn');
        updateButtons();
      });

      ws.addEventListener('error', () => {
        setStatus('WebSocket error', 'err');
      });
    }

    function startStream() {
      streaming = true;
      setStatus('Streaming', 'ok');
      updateButtons();
    }

    function stopStream() {
      streaming = false;
      setStatus('Connected (idle)', 'warn');
      updateButtons();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'imu', seq: (seq + 1) & 0xFF, quat: { w: 1, x: 0, y: 0, z: 0 }, flags: 0 }));
      }
    }

    function sendHomeReset() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'home' }));
      }
    }

    connectBtn.addEventListener('click', connect);
    motionBtn.addEventListener('click', enableMotion);
    streamBtn.addEventListener('click', startStream);
    stopBtn.addEventListener('click', stopStream);
    homeBtn.addEventListener('click', sendHomeReset);

    updateButtons();
  </script>
</body>
</html>
