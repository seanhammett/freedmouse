; PlatformIO Project Configuration File
; USB_freeD — 3D IMU Mouse using CodeCell C6 (ESP32-C6 + BNO085)
;
; Three environments:
;   codecell-c6     = Original serial streaming (for Chrome extension)
;   sender          = CodeCell C6 — ESP-NOW quaternion broadcaster
;   receiver        = Arduino Nano ESP32 (S3) — ESP-NOW → SpaceMouse USB HID

; --- Original: quaternion streaming over USB Serial ---
[env:codecell-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_ESP32C6_DEV
build_src_filter = +<main.cpp> +<packet.h>
lib_deps =
  https://github.com/microbotsio/CodeCell

; --- Sender: CodeCell C6 broadcasts quaternion over ESP-NOW ---
[env:sender]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_ESP32C6_DEV
build_src_filter = +<sender.cpp> +<espnow_packet.h>
lib_deps =
  https://github.com/microbotsio/CodeCell

; --- Receiver: ESP32-S3-DevKitC-1 (WROOM-2) — ESP-NOW to SpaceMouse HID ---
; WROOM-2: 16 MB flash, 8 MB OPI PSRAM.
; USB HID (TinyUSB) on native USB OTG pins (GPIO 19/20); NeoPixel on GPIO 48.
[env:receiver]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = opi
board_build.f_flash = 80000000L
board_build.arduino.memory_type = opi_opi
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<receiver.cpp> +<espnow_packet.h> +<target_packet.h>

; --- Utility: just prints MAC address over serial ---
[env:mac-check]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = opi
board_build.f_flash = 80000000L
board_build.arduino.memory_type = opi_opi
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<mac_check.cpp>
