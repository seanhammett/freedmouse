; PlatformIO Project Configuration File
; USB_freeD — 3D IMU Mouse using CodeCell C6 (ESP32-C6 + BNO085)
;
; Three environments:
;   codecell-c6     = Original serial streaming (for Chrome extension)
;   sender          = CodeCell C6 — ESP-NOW quaternion broadcaster
;   receiver        = Arduino Nano ESP32 (S3) — ESP-NOW → SpaceMouse USB HID

; --- Original: quaternion streaming over USB Serial ---
[env:codecell-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_ESP32C6_DEV
build_src_filter = +<main.cpp> +<packet.h>
lib_deps =
  https://github.com/microbotsio/CodeCell

; --- Sender: CodeCell C6 broadcasts quaternion over ESP-NOW ---
[env:sender]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_ESP32C6_DEV
  -DCONFIG_ESP32_DEFAULT_CPU_FREQ_80=1
  -DCONFIG_PM_ENABLE=1
  -DCONFIG_FREERTOS_USE_TICKLESS_IDLE=1
build_src_filter = +<sender.cpp> +<espnow_packet.h>
lib_deps =
  https://github.com/microbotsio/CodeCell

; --- Receiver: Arduino Nano ESP32 (S3) — ESP-NOW to SpaceMouse HID ---
; Uses generic S3 board def to avoid Nano's pin-remap macro conflicts with USB lib.
; Pin numbering uses GPIO numbers directly (which the Nano exposes anyway).
[env:receiver]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<receiver.cpp> +<espnow_packet.h>

; --- Utility: just prints MAC address over serial ---
[env:mac-check]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<mac_check.cpp>
